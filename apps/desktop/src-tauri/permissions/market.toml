[[permission]]
identifier = "allow-market-commands"
description = "Allow Market Assistant product, sale, auth, settings, backup, import/export, and return stub commands"
commands.allow = [
  "products_list",
  "products_get_by_barcode",
  "products_create",
  "products_update",
  "products_deactivate",
  "sales_checkout",
  "sales_list",
  "sales_get",
  "sales_void",
  "reports_daily",
  "reports_range",
  "reports_today_summary",
  "returns_create",
  "auth_login",
  "auth_logout",
  "auth_session_status",
  "settings_get",
  "settings_set_store_name",
  "settings_set_owner_credentials",
  "backup_info",
  "backup_create",
  "backup_inspect",
  "backup_restore",
  "products_import_preview",
  "products_import_apply",
  "products_export",
  "products_export_template"
]
