[package]
name = "market_assistant"
version = "0.1.0"
description = "Market Asistanı — barkod fiyat ve kasa"
authors = ["Market Assistant"]
edition = "2021"

[lib]
name = "market_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
tauri-plugin-dialog = "2"
calamine = "0.38"
csv = "1"
encoding_rs = "0.8"
rust_xlsxwriter = "0.102"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
